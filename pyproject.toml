[project]
name = "demon-cry-base"
description = "Base classes for demon-cry OSINT plugins"
requires-python = ">=3.12, <3.15"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{name = "mooncore-inc"}]
dynamic = ["version"]

dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1,<5.0.0",
    "ruff>=0.16.6,<0.17.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM","RET"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
