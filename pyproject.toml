[project]
name = "demon-cry-base"
dynamic = ["version"]
description = "Base classes for demon-cry OSINT plugins"
authors = [
    {name = "mooncore-inc"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (неиспользуемые переменные и импорты)
    "I",   # isort (сортировка импортов)
    "UP",  # pyupgrade (современный синтаксис)
    "B",   # flake8-bugbear (антипаттерны, изменяемые аргументы по умолчанию)
    "SIM", # flake8-simplify (упрощение синтаксиса)
    "RET", # flake8-return (оптимизация return)
]
ignore = [
    "E501", # длину строки контролирует ruff-format
]

[tool.ruff.format]
quote-style = "double"

[tool.poetry]
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
